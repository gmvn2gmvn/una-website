  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const DEFAULT_INTERVAL = 3000; // 3s
    function startRotator(wrapper) {
      const slides = Array.from(wrapper.querySelectorAll('.rotator-item'));
      if (!slides.length) return;
      // Ensure wrapper can contain absolutely positioned slides
      const cs = getComputedStyle(wrapper);
      if (cs.position === 'static') wrapper.style.position = 'relative';
      // Show first, hide the rest
      slides.forEach(s => s.style.opacity = 0);
      let i = 0;
      slides[0].style.opacity = 1;
      const intervalMs = parseInt(wrapper.getAttribute('data-interval') || DEFAULT_INTERVAL, 10);
      // Pause when offscreen (optional)
      let paused = false;
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => paused = !entry.isIntersecting);
        }, { threshold: 0.1 });
        io.observe(wrapper);
      }
      setInterval(() => {
        if (paused || slides.length < 2) return;
        const current = slides[i];
        const next = slides[(i + 1) % slides.length];
        current.style.opacity = 0;
        next.style.opacity = 1;
        i = (i + 1) % slides.length;
      }, intervalMs);
    }
    document.querySelectorAll('.cms-rotator').forEach(startRotator);
  });
</script>
